[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medical-ai-platform"
version = "0.1.0"
description = "Structured QuerySpec to MySQL/MCP MVP for a medical big data and AI analysis platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
    "mcp[cli]>=2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyMySQL>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "redis>=5.2,<7",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medical_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services such as MySQL",
]
addopts = "-q"
